name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Validate
        run: |
          python scripts/validate.py
          git diff --check
      - name: Verify tag matches VERSION
        shell: bash
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)"
      - name: Package
        run: python scripts/package_release.py --version "${GITHUB_REF_NAME}"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/codex-sol-luna-switchable-"$GITHUB_REF_NAME".zip \
            dist/SHA256SUMS.txt \
            --verify-tag \
            --generate-notes \
            --title "Codex Sol/Luna Switchable $GITHUB_REF_NAME"
