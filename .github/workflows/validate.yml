name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m py_compile scripts/install.py scripts/validate.py scripts/package_release.py
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate release contents
        run: python scripts/validate.py
      - name: Check shell launchers
        if: runner.os != 'Windows'
        run: |
          bash -n bin/codex-mode
          bash -n scripts/switch-mode.sh
      - name: Git whitespace check
        run: git diff --check
